packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Both Astryx postinstalls only print a "run astryx init" nudge. They are
  # read-only (no writes, no network, no child processes) and stay quiet once a
  # project has the Astryx marker in its agent docs, which this one does. So
  # there is nothing to gain by running them.
  "@astryxdesign/cli": false
  "@astryxdesign/core": false
  # esbuild arrives under `tsx`, which apps/docs uses to run its prebuild
  # generator. Its postinstall exists to fetch or relink the platform binary
  # for installers that handle optionalDependencies badly; pnpm installs
  # `@esbuild/<platform>` properly and esbuild resolves the binary out of it,
  # so the script has nothing left to do. Verified by running tsx with the
  # script skipped. Flip to true if a platform ever disagrees.
  esbuild: false
  sharp: true
