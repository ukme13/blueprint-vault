name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtered to `main`, a PR based on
  # another branch matched no trigger at all and got no run — which is not a
  # red X, it is an empty checks list that reads as "nothing to report". Five
  # stacked PRs were opened and reviewed that way, and the one type error among
  # them reached main because no run had ever looked at it.
  pull_request:

concurrency:
  # Per branch, not per workflow. The group was shared by every ref, so four
  # merges landing in a row cancelled each other and left one completed run
  # between them; the three cancelled ones are indistinguishable from three
  # that never started.
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's later push makes its earlier run irrelevant, so cancel it.
  # A push to main is a merge that is already in the history and the only run
  # that will ever exist for it, so it finishes even if the next merge arrives
  # first.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  # A job cannot carry a `paths` filter — `paths` is only valid under `on.<event>`,
  # where it would gate the whole workflow rather than one job. So the filtering
  # is a job that reports what changed, and `e2e` runs on its answer.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter reads the PR's file list through the API on pull_request.
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # Optional for pull_request, required for push: on a push the filter
      # compares commits with git rather than calling the API.
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'apps/playground/**'
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            # The documentation app and the package it renders from. The
            # playground is deliberately absent: a change there cannot move a
            # foundation page, which reads a workspace file and the export.
            docs:
              - 'apps/docs/**'
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright e2e (playground)
    runs-on: ubuntu-latest
    needs: [checks, changes]
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the Playwright version rather than the lockfile, because the
      # browser build is what the version pins. Hashing the lockfile would
      # throw the browsers away every time an unrelated dependency moved.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter playground exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter playground exec playwright install --with-deps chromium

      # The browsers are cached; the OS packages `--with-deps` installs are
      # not, because apt puts them outside ~/.cache/ms-playwright. A cache hit
      # therefore still needs this, or Chromium is present and will not start.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter playground exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter playground test:e2e

  docs-e2e:
    name: Playwright e2e (docs)
    runs-on: ubuntu-latest
    needs: [checks, changes]
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the Playwright version, and shared with the playground's job:
      # the two apps resolve the same version from one lockfile, so a second
      # cache under a second key would download the same browser twice.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter docs exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter docs exec playwright install-deps chromium

      # The config's webServer builds and starts the app, so this needs no
      # separate build step — and the pages under test are the built ones.
      - name: Run Playwright tests
        run: pnpm --filter docs test:e2e

  handover:
    name: The handover archive
    runs-on: ubuntu-latest
    needs: [checks]
    # Pushes to main only. It builds the documentation app a second time and
    # then opens every page in a browser, which is around four minutes on top
    # of a run that already builds twice — too much to spend on a pull request
    # that changes a comment. What it guards is a command nobody runs by
    # accident, so catching a break on the merge is soon enough to matter and
    # late enough to be affordable.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter docs exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter docs exec playwright install-deps chromium

      - name: Build the handover for the reference workspace
        run: pnpm handover

      # Unzipped into a temporary folder and opened over file://, which is the
      # only check that catches a page working on a server and failing from a
      # directory.
      - name: Open the archive from disk
        run: pnpm exec tsx scripts/verify-handover.ts
